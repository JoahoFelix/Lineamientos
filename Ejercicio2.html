<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planetas SWAPI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="contenedor">
    <h1>Planetas</h1>

    <form action="" id="formBuscador">
      <label for="idplaneta">Código del planeta</label>
      <div class="busqueda">
        <input type="text" id="idplaneta" placeholder="" inputmode="numeric">
        <button type="submit" id="botonBuscar">Buscar</button>
      </div>
    </form>

    <p id="mensaje" role="status"></p>
    <div id="animacion"></div>

    <h2>Datos del planeta</h2>
    <ul id="listaDatos"></ul>

    <h2>Personajes que habitan el planeta</h2>
    <ul id="listaPersonajes"></ul>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Referencias a los controles HTML
      const formulario = document.getElementById("formBuscador")
      const id = document.getElementById("idplaneta")
      const listaDatos = document.getElementById("listaDatos")
      const listaPersonajes = document.getElementById("listaPersonajes")
      const mensaje = document.getElementById("mensaje")
      const animacion = document.getElementById("animacion")
      const boton = document.getElementById("botonBuscar")

      // Limpiar ambas listas antes de cada búsqueda
      function resetUI() {
        listaDatos.innerHTML = ""
        listaPersonajes.innerHTML = ""
        mensaje.innerText = ""
      }

      formulario.addEventListener("submit", (event) => {
        event.preventDefault()

        const idBuscado = parseInt(id.value)

        // Validar el código del planeta
        if (id.value.trim() == "" || isNaN(id.value) || idBuscado <= 0 || idBuscado != id.value) {
          resetUI()
          mensaje.innerText = "Ingrese un código numérico entero mayor que 0."
          return
        }

        obtenerPlaneta(idBuscado)
      })

      async function obtenerPlaneta(id) {
        resetUI()
        mensaje.innerText = "Buscando planeta..."
        animacion.setAttribute("class", "loader")
        boton.disabled = true

        const API_URL = `https://swapi.dev/api/planets/${id}/`

        try {
          const respuesta = await fetch(API_URL)

          if (!respuesta.ok) {
            if (respuesta.status == 404) {
              mensaje.innerText = "No existe un planeta con ese código."
            } else {
              mensaje.innerText = "No se pudo obtener el planeta."
            }
          } else {
            const datos = await respuesta.json()
            console.log(datos)

            // Crear los seis datos que se mostrarán en la primera lista
            const detalles = [
              { nombre: "Nombre", valor: datos.name },
              { nombre: "Periodo de rotación", valor: datos.rotation_period },
              { nombre: "Diámetro", valor: datos.diameter },
              { nombre: "Gravedad", valor: datos.gravity },
              { nombre: "Tipo de terreno", valor: datos.terrain },
              { nombre: "Cantidad de habitantes", valor: datos.population }
            ]

            // Mostrar los datos del planeta en elementos <li>
            detalles.forEach((detalle) => {
              const li = document.createElement("li")
              li.innerText = `${detalle.nombre}: ${detalle.valor}`
              listaDatos.appendChild(li)
            })

            // 'residents' contiene URL, no nombres. Hay que consultar cada URL.
            const residentes = datos.residents

            if (residentes.length == 0) {
              const li = document.createElement("li")
              li.innerText = "No hay personajes registrados en este planeta."
              listaPersonajes.appendChild(li)
            } else {
              mensaje.innerText = "Cargando los personajes del planeta..."

              // Usamos for con await para cargar cada habitante antes de terminar.
              for (let i = 0; i < residentes.length; i++) {
                try {
                  const respuestaPersonaje = await fetch(residentes[i])

                  if (respuestaPersonaje.ok) {
                    const personaje = await respuestaPersonaje.json()
                    const li = document.createElement("li")
                    li.innerText = personaje.name
                    listaPersonajes.appendChild(li)
                  } else {
                    const li = document.createElement("li")
                    li.innerText = "No se pudo cargar uno de los personajes."
                    listaPersonajes.appendChild(li)
                  }
                } catch (e) {
                  console.error(e)
                  const li = document.createElement("li")
                  li.innerText = "Error de conexión al consultar un personaje."
                  listaPersonajes.appendChild(li)
                }
              }
            }

            mensaje.innerText = "Consulta del planeta terminada."
          }
        } catch (e) {
          console.error(e)
          mensaje.innerText = "Error de conexión con SWAPI."
        }

        animacion.removeAttribute("class")
        boton.disabled = false
      }
    })
  </script>
</body>
</html>
