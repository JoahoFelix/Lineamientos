<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personajes SWAPI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="contenedor">
    <h1>Personajes</h1>

    <form action="" id="formBuscador">
      <label for="idpersonaje">Código del personaje</label>
      <div class="busqueda">
        <input type="text" id="idpersonaje" placeholder="" inputmode="numeric">
        <button type="submit" id="botonBuscar">Buscar</button>
      </div>

      <p id="mensaje" role="status"></p>
      <div id="animacion"></div>

      <h2>Datos del personaje</h2>
      <div class="campos">
        <div class="campo-nombre">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" readonly>
        </div>
        <div>
          <label for="estatura">Estatura (cm)</label>
          <input type="text" id="estatura" readonly>
        </div>
        <div>
          <label for="peso">Peso (kg)</label>
          <input type="text" id="peso" readonly>
        </div>
        <div>
          <label for="cabello">Color de cabello</label>
          <input type="text" id="cabello" readonly>
        </div>
        <div>
          <label for="genero">Género</label>
          <input type="text" id="genero" readonly>
        </div>
      </div>
    </form>

    <h2>Cantidad de elementos</h2>
    <table class="tabla">
      <thead>
        <tr>
          <th>Películas</th>
          <th>Vehículos</th>
          <th>Naves</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td id="peliculas">0</td>
          <td id="vehiculos">0</td>
          <td id="naves">0</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Referencias a los controles del formulario
      const formulario = document.getElementById("formBuscador")
      const id = document.getElementById("idpersonaje")
      const nombre = document.getElementById("nombre")
      const estatura = document.getElementById("estatura")
      const peso = document.getElementById("peso")
      const cabello = document.getElementById("cabello")
      const genero = document.getElementById("genero")
      const peliculas = document.getElementById("peliculas")
      const vehiculos = document.getElementById("vehiculos")
      const naves = document.getElementById("naves")
      const mensaje = document.getElementById("mensaje")
      const animacion = document.getElementById("animacion")
      const boton = document.getElementById("botonBuscar")

      // Limpiar los resultados de la búsqueda anterior
      function resetUI() {
        nombre.value = ""
        estatura.value = ""
        peso.value = ""
        cabello.value = ""
        genero.value = ""
        peliculas.innerText = "0"
        vehiculos.innerText = "0"
        naves.innerText = "0"
        mensaje.innerText = ""
      }

      // Detener el envío del formulario para realizar la consulta
      formulario.addEventListener("submit", (event) => {
        event.preventDefault()

        const idBuscado = parseInt(id.value)

        // Validar: dato vacío, letras, decimales y números negativos
        if (id.value.trim() == "" || isNaN(id.value) || idBuscado <= 0 || idBuscado != id.value) {
          resetUI()
          mensaje.innerText = "Ingrese un código numérico entero mayor que 0."
          return
        }

        obtenerPersonaje(idBuscado)
      })

      async function obtenerPersonaje(id) {
        resetUI()
        mensaje.innerText = "Buscando personaje..."
        animacion.setAttribute("class", "loader")
        boton.disabled = true

        const API_URL = `https://swapi.dev/api/people/${id}/`

        try {
          const respuesta = await fetch(API_URL)

          if (!respuesta.ok) {
            if (respuesta.status == 404) {
              mensaje.innerText = "No existe un personaje con ese código."
            } else {
              mensaje.innerText = "No se pudo obtener el personaje."
            }
          } else {
            const datos = await respuesta.json()
            console.log(datos)

            // Mostrar los datos del personaje en los INPUT
            nombre.value = datos.name
            estatura.value = datos.height
            peso.value = datos.mass
            cabello.value = datos.hair_color
            genero.value = datos.gender

            // Cada propiedad es un arreglo: .length indica su tamaño
            peliculas.innerText = datos.films.length
            vehiculos.innerText = datos.vehicles.length
            naves.innerText = datos.starships.length

            mensaje.innerText = "Personaje encontrado correctamente."
          }
        } catch (e) {
          console.error(e)
          mensaje.innerText = "Error de conexión con SWAPI."
        }

        animacion.removeAttribute("class")
        boton.disabled = false
      }
    })
  </script>
</body>
</html>
